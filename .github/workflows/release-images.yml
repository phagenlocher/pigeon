# Publish pigeon-server and pigeon-client to GHCR when a GitHub release is
# published.
#
# Both architectures are built on native runners (ubuntu-24.04 is amd64,
# ubuntu-24.04-arm is arm64), so no QEMU or binfmt emulation is involved. Each
# runner builds a single-platform image and pushes it *by digest*; the merge job
# then assembles the multi-arch manifest list and is the only step that creates
# real tags. A failed arm build or smoke test therefore leaves no version tag
# pointing at a half-published image.
#
# Provenance is attached in the merge job with actions/attest-build-provenance,
# against the final multi-arch digest. Per-arch builds set `provenance: false`:
# with provenance enabled buildx wraps each image in a one-member index, and
# merging those would produce nested indexes that some clients cannot resolve.
#
# `--target server|client` only selects the final stage; the `build` stage that
# compiles both binaries is identical, so the two builds share one cache scope
# per architecture and the client build reuses the server build's -O2 output.

name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        default: main
        type: string
      version:
        description: Version to publish; must equal `version:` in pigeon.cabal
        required: true
        type: string
      prerelease:
        description: Skip the `latest` tag
        required: false
        default: true
        type: boolean

concurrency:
  group: release-images-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Required by actions/attest-build-provenance (keyless signing via OIDC).
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
      server-image: ${{ steps.resolve.outputs.server-image }}
      client-image: ${{ steps.resolve.outputs.client-image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      # The tag people see must match the binary they get. Tagging a release
      # `v0.2.0` while pigeon.cabal still says 0.1.0.0 would publish an image
      # whose `--version` and /healthz output contradict its tag.
      - name: Resolve version and tags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
            prerelease="$RELEASE_PRERELEASE"
            target_ref="$RELEASE_TAG"
          else
            version="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
            target_ref="$INPUT_REF"
          fi

          cabal_version="$(sed -n 's/^version:[[:space:]]*//p' pigeon.cabal | head -n1 | tr -d '[:space:]')"
          if [ -z "$version" ] || [ "$version" != "$cabal_version" ]; then
            echo "::error::version '$version' does not match pigeon.cabal version '$cabal_version'"
            exit 1
          fi

          # 0.1.0.0 -> 0.1.0.0 0.1.0 0.1 latest. Prereleases get the exact
          # version only, so testing never moves the `latest` tag. The
          # associative array drops repeats for short versions such as 1.0.
          candidates=("$version")
          if [ "$prerelease" != "true" ]; then
            minor="${version%.*}"
            major="${minor%.*}"
            candidates+=("$minor" "$major" "latest")
          fi
          declare -A seen=()
          unique=()
          for tag in "${candidates[@]}"; do
            if [ -z "${seen[$tag]:-}" ]; then
              seen["$tag"]=1
              unique+=("$tag")
            fi
          done
          tags="${unique[*]}"

          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          {
            echo "ref=$target_ref"
            echo "version=$version"
            echo "tags=$tags"
            echo "server-image=$REGISTRY/$owner/pigeon-server"
            echo "client-image=$REGISTRY/$owner/pigeon-client"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $version as: $tags"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      # The Haskell toolchain image plus an -O2 build of the dependency closure
      # is several GB on a runner with ~14 GB free. Drop tool caches this build
      # never uses before BuildKit starts filling the disk.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/PyPy \
                      /opt/microsoft \
                      /usr/local/lib/android \
                      /usr/share/dotnet 2>/dev/null || true
          docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server by digest
        id: server
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.server-image }},push-by-digest=true,name-canonical=true,push=true
          # Everything, dependencies included, at -O2 (see cabal.project.release).
          build-args: CABAL_PROJECT_FILE=cabal.project.release
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # The manifest list does not exist yet, but the digest does, so the image
      # can be pulled and run natively before anything is tagged.
      - name: Smoke test server
        env:
          IMAGE: ${{ needs.prepare.outputs.server-image }}
          DIGEST: ${{ steps.server.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker pull "$ref"
          docker run --detach --name pigeon-smoke \
            --env PIGEON_NO_TLS=1 \
            --env PIGEON_PORT=8080 \
            --env PIGEON_TOKEN=smoke-token-at-least-16-chars \
            --publish 18080:8080 \
            "$ref"
          trap 'docker rm --force pigeon-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! grep --quiet "\"status\":\"ok\"" /tmp/health.json; then
            docker logs pigeon-smoke || true
            echo "::error::server image did not become healthy"
            exit 1
          fi
          if ! grep --quiet "\"version\":\"$VERSION\"" /tmp/health.json; then
            docker logs pigeon-smoke || true
            echo "::error::server image reports a different version"
            exit 1
          fi
          cat /tmp/health.json
          docker logs pigeon-smoke

      - name: Build client by digest
        id: client
        uses: docker/build-push-action@v7
        with:
          context: .
          target: client
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.client-image }},push-by-digest=true,name-canonical=true,push=true
          # Everything, dependencies included, at -O2 (see cabal.project.release).
          build-args: CABAL_PROJECT_FILE=cabal.project.release
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Smoke test client
        env:
          IMAGE: ${{ needs.prepare.outputs.client-image }}
          DIGEST: ${{ steps.client.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker pull "$ref"
          reported="$(docker run --rm "$ref" --version | tr -d '[:space:]')"
          echo "client reports: $reported"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::client reports '$reported', expected '$VERSION'"
            exit 1
          fi

      - name: Record digests
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          CLIENT_DIGEST: ${{ steps.client.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$SERVER_DIGEST" > "$RUNNER_TEMP/digests/server-$ARCH.txt"
          printf '%s\n' "$CLIENT_DIGEST" > "$RUNNER_TEMP/digests/client-$ARCH.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest lists
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      server-digest: ${{ steps.manifest.outputs.server-digest }}
      client-digest: ${{ steps.manifest.outputs.client-digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        id: manifest
        env:
          SERVER_IMAGE: ${{ needs.prepare.outputs.server-image }}
          CLIENT_IMAGE: ${{ needs.prepare.outputs.client-image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          read -r -a tags <<< "$TAGS"

          for kind in server client; do
            case "$kind" in
              server) image="$SERVER_IMAGE" ;;
              client) image="$CLIENT_IMAGE" ;;
            esac

            args=()
            for tag in "${tags[@]}"; do
              args+=("--tag" "${image}:${tag}")
            done

            docker buildx imagetools create "${args[@]}" \
              "${image}@$(cat "$DIGESTS/$kind-amd64.txt")" \
              "${image}@$(cat "$DIGESTS/$kind-arm64.txt")"

            listing="$(docker buildx imagetools inspect "${image}:${VERSION}")"
            echo "$listing"

            # --raw writes the manifest bytes unchanged, so the file's SHA-256
            # is the index digest the registry reports.
            docker buildx imagetools inspect --raw "${image}:${VERSION}" \
              > "$RUNNER_TEMP/index-$kind.json"

            # Guard against an accidentally nested index: exactly two image
            # manifests, one per architecture.
            count="$(jq '.manifests | length' "$RUNNER_TEMP/index-$kind.json")"
            if [ "$count" != "2" ]; then
              echo "::error::${image}:${VERSION} has $count manifests, expected 2"
              exit 1
            fi
            jq --exit-status \
              '.manifests[] | select(.platform.architecture == "amd64")' \
              "$RUNNER_TEMP/index-$kind.json" >/dev/null
            jq --exit-status \
              '.manifests[] | select(.platform.architecture == "arm64")' \
              "$RUNNER_TEMP/index-$kind.json" >/dev/null

            digest="sha256:$(sha256sum "$RUNNER_TEMP/index-$kind.json" | cut --delimiter=' ' --fields=1)"
            echo "${kind}-digest=$digest" >> "$GITHUB_OUTPUT"
            echo "${image}:${VERSION} -> ${digest}"
          done

      - name: Attest server provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.prepare.outputs.server-image }}
          subject-digest: ${{ steps.manifest.outputs.server-digest }}

      - name: Attest client provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.prepare.outputs.client-image }}
          subject-digest: ${{ steps.manifest.outputs.client-digest }}

  release-notes:
    name: Update release notes
    needs: [prepare, merge]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Append image pull commands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot discover the repository from
          # a git remote and fails with "not a git repository". GH_REPO is the
          # environment equivalent of `gh --repo`.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SERVER_IMAGE: ${{ needs.prepare.outputs.server-image }}
          CLIENT_IMAGE: ${{ needs.prepare.outputs.client-image }}
        run: |
          set -euo pipefail

          block="$(printf '%s\n' \
            '<!-- pigeon-images -->' \
            '### Container images' \
            '' \
            '```bash' \
            "docker pull ${SERVER_IMAGE}:${VERSION}" \
            "docker pull ${CLIENT_IMAGE}:${VERSION}" \
            '```' \
            '<!-- /pigeon-images -->')"

          # Replace an existing block so re-running the workflow is idempotent.
          current="$(gh release view "$TAG" --json body --jq '.body')"
          stripped="$(printf '%s\n' "$current" | awk '
            /<!-- pigeon-images -->/ { skip = 1; next }
            /<!-- \/pigeon-images -->/ { skip = 0; next }
            !skip
          ')"
          printf '%s\n\n%s\n' "$stripped" "$block" > "$RUNNER_TEMP/notes.md"

          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
