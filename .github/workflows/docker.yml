# Build both Docker targets on amd64 whenever the packaging inputs change.
#
# This exists so a broken Dockerfile or cabal file is caught on the pull request
# that changes it, not on the release that needs to ship an image. It builds
# only amd64: the release workflow exercises native arm64 on ubuntu-24.04-arm,
# and duplicating that here would double CI time for a check that only guards
# the recipe.
#
# Nothing is pushed. Both images are loaded into the local daemon and smoke
# tested with the same checks the release workflow runs.

name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - cabal.project
      - pigeon.cabal
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - cabal.project
      - pigeon.cabal
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/PyPy \
                      /opt/microsoft \
                      /usr/local/lib/android \
                      /usr/share/dotnet 2>/dev/null || true
          docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Read expected version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pigeon.cabal | head -n1 | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build server
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: pigeon-server:ci
          provenance: false
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64

      - name: Smoke test server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run --detach --name pigeon-smoke \
            --env PIGEON_NO_TLS=1 \
            --env PIGEON_PORT=8080 \
            --env PIGEON_TOKEN=smoke-token-at-least-16-chars \
            --publish 18080:8080 \
            pigeon-server:ci
          trap 'docker rm --force pigeon-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! grep --quiet "\"status\":\"ok\"" /tmp/health.json; then
            docker logs pigeon-smoke || true
            echo "::error::server image did not become healthy"
            exit 1
          fi
          if ! grep --quiet "\"version\":\"$VERSION\"" /tmp/health.json; then
            docker logs pigeon-smoke || true
            echo "::error::server image reports a different version"
            exit 1
          fi
          cat /tmp/health.json
          docker logs pigeon-smoke

      - name: Build client
        uses: docker/build-push-action@v7
        with:
          context: .
          target: client
          platforms: linux/amd64
          load: true
          tags: pigeon-client:ci
          provenance: false
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64

      - name: Smoke test client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(docker run --rm pigeon-client:ci --version | tr -d '[:space:]')"
          echo "client reports: $reported"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::client reports '$reported', expected '$VERSION'"
            exit 1
          fi
