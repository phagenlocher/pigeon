name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHC_VERSION: '9.14.1'
  CABAL_VERSION: '3.16.1.0'
  # Keep these pins in step with the versions used locally (`fourmolu --version`,
  # `hlint --version`). The style comes from fourmolu.yaml; bumping the pin may
  # require `fourmolu -i src app test`.
  FOURMOLU_VERSION: '0.21.0.0'
  HLINT_VERSION: '3.10'

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      - name: Install fourmolu and hlint
        run: |
          ghcup config add-release-channel 3rdparty
          ghcup install fourmolu "$FOURMOLU_VERSION" --set
          ghcup install hlint "$HLINT_VERSION" --set
          fourmolu --version
          hlint --version

      # TEST-281: formatting must be clean.
      - name: fourmolu --mode check src app test
        run: fourmolu --mode check src app test

      # TEST-281: hlint reports nothing (it exits non-zero on any hint).
      - name: hlint src app test
        run: hlint src app test

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache cabal store and build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-noopt-${{ hashFiles('cabal.project', 'pigeon.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-noopt-

      # TEST-280: -Wall warnings become errors. `--ghc-options` applies only to
      # the local packages, never to dependencies.
      # `--disable-optimization` keeps CI fast: it overrides the optimization: 2
      # stanza in cabal.project, so GHC is invoked at -O0. Both steps pass
      # identical flags so the test run reuses the artefacts built by the
      # previous step.
      - name: cabal build all
        run: cabal build all --disable-optimization --ghc-options="-Werror"

      - name: cabal test all
        run: cabal test all --disable-optimization --ghc-options="-Werror" --test-show-details=direct
