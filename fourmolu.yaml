# Fourmolu configuration for Pigeon.
#
# The project uses 2-space indentation, a 100-column limit and trailing commas.
# The sorting knobs keep constraints and deriving clauses deterministic.
#
# Every option is listed explicitly so style changes are reviewable rather
# than inherited from a fourmolu upgrade.

# Number of spaces per indentation step
indentation: 2

# Max line length for automatic line breaking
column-limit: 100

# How to place commas in multi-line lists, records, etc.
comma-style: trailing

# Group imports by scope: external modules first, then modules defined by the
# current Cabal package. Local modules are detected from pigeon.cabal, so the
# Pigeon.* modules do not need to be listed here.
import-grouping: by-scope

# Whether to sort constraints
sort-constraints: true

# Whether to sort derived classes
sort-derived-classes: true

# Whether to sort deriving clauses
sort-deriving-clauses: true
